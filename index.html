<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODIN Form - Project 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="sign-up">
        <div class="sign-up__wrapper">
          <div class="sign-up__sidenav">
            <div class="sign-up__logo">
              <img
                src="./img/odin-lined.png"
                alt="Odin Lined"
                class="sign-up__image"
                width="48"
              />
              <span class="sign-up__logo-text">ODIN</span>
            </div>
          </div>

          <form action="" method="">
            <div class="sign-up__content-wrapper">
              <div class="sign-up__text">
                <p>
                  This is not real online service! You know you need something
                  like this in your life to help you realize your deepest
                  dreams.
                  <br />
                  Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
              </div>

              <div class="sign-up__inputs-wrapper">
                <h3 class="sign-up__form-heading">Let's do this!</h3>
                <div class="sign-up__inputs">
                  <div class="sign-up__left-inputs">
                    <div class="sign-up__item">
                      <label for="first_name">FIRST NAME</label>
                      <input
                        type="text"
                        name="first_name"
                        id="first_name"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="email">EMAIL</label>
                      <input type="email" name="email" id="email" required />
                    </div>

                    <div class="sign-up__item">
                      <label for="password">PASSWORD</label>
                      <input
                        type="password"
                        name="password"
                        id="password"
                        required
                      />
                    </div>
                  </div>

                  <div class="sign-up__right-inputs">
                    <div class="sign-up__item">
                      <label for="last__name">LAST NAME</label>
                      <input
                        type="text"
                        name="last__name"
                        id="last__name"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="phone_number">PHONE NUMBER</label>
                      <input
                        type="tel"
                        name="phone_number"
                        id="phone_number"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="confirm_password">CONFIRM PASSWORD</label>
                      <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        required
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="sign-up__button-wrapper">
                <button type="submit" class="sign-up__button">
                  Create Account
                </button>
                <p class="sign-up__account-prompt">
                  Already have an account?
                  <a href="#!" class="sign-up__login">Log in</a>
                </p>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
