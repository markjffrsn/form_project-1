<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODIN Form - Project 1</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/.favicon/favicon.svg" />
    <link rel="shortcut icon" href="/.favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./favicon/site.webmanifest" />
  </head>
  <body>
    <main>
      <section class="sign-up">
        <div class="sign-up__wrapper">
          <aside class="sign-up__sidenav">
            <div class="sign-up__logo">
              <img
                src="./img/odin-lined.png"
                alt="Odin Lined"
                class="sign-up__image"
                width="48"
              />
              <span class="sign-up__logo-text">ODIN</span>
            </div>
            <p class="sign-up__photo-credit">
              Photo by
              <a
                href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
                target="_blank"
                rel="noopener noreferrer"
                >Halie West</a
              >
              on
              <a
                href="https://unsplash.com/"
                target="_blank"
                rel="noopener noreferrer"
                >Unsplash</a
              >
            </p>
          </aside>

          <form
            action="https://httpbin.org/post"
            method="post"
            class="sign-up__form"
          >
            <div class="sign-up__content-wrapper">
              <div class="sign-up__text responsive">
                <p>
                  This is not real online service! You know you need something
                  like this in your life to help you realize your deepest
                  dreams.
                  <br />
                  Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
              </div>

              <div class="sign-up__inputs-wrapper">
                <h3 class="sign-up__form-heading responsive">Let's do this!</h3>
                <div class="sign-up__inputs responsive">
                  <div class="sign-up__inputs-item">
                    <div class="sign-up__item">
                      <label for="first_name"
                        >FIRST NAME<span class="required">*</span>
                      </label>
                      <input
                        type="text"
                        name="first_name"
                        id="first_name"
                        placeholder="Thor"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="last__name">LAST NAME</label>
                      <input
                        type="text"
                        name="last__name"
                        id="last__name"
                        placeholder="Odinson"
                      />
                    </div>
                  </div>

                  <div class="sign-up__inputs-item">
                    <div class="sign-up__item">
                      <label for="email"
                        >EMAIL<span class="required">*</span></label
                      >
                      <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="name@example.com"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="phone_number"
                        >PHONE NUMBER<span class="required">*</span></label
                      >
                      <input
                        type="tel"
                        name="phone_number"
                        id="phone_number"
                        placeholder="+123 456 7890"
                        required
                      />
                    </div>
                  </div>

                  <div class="sign-up__inputs-item">
                    <div class="sign-up__item">
                      <label for="password"
                        >PASSWORD<span class="required">*</span></label
                      >
                      <input
                        type="password"
                        name="password"
                        id="password"
                        minlength="8"
                        placeholder="8+ chars, 1 uppercase, 1 symbol"
                        required
                      />
                    </div>

                    <div class="sign-up__item">
                      <label for="confirm_password"
                        >CONFIRM PASSWORD<span class="required">*</span></label
                      >
                      <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        minlength="8"
                        placeholder="Retype password"
                        required
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="sign-up__button-wrapper responsive">
                <button type="submit" class="sign-up__button">
                  Create Account
                </button>
                <p class="sign-up__account-prompt">
                  Already have an account?
                  <a
                    href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTHHxLaRWKDfg6XgBZDensX7AJ-mtj1OhO4Gjy-5Na6qwbhm_CtR7itV3S&s=10"
                    class="sign-up__login"
                    target="_blank"
                    >Log in</a
                  >
                </p>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
